name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Build ARM binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: go build ./...
